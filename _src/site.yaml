# Projects, grouped by field. Numbers (kpis) come from published papers only.
# Unpublished work: no numbers, no internal hardware blocks (system-level figures, photos, demo videos are OK).
#   id = URL of the detail page (projects/<id>/)   pubs = bib keys   highlight = card on the home page
project_groups:
- name: FPGA accelerators for reservoir computing
  projects:
  - id: onchip-rls
    title: On-chip RLS learning for MIMO channel prediction
    period: 2024 – 2026
    tag: TCAD'26
    img: tcad_overall.png
    text: 'A complete echo state network on one FPGA: inference and recursive-least-squares (RLS) training share
      the same DSP arrays, so the channel predictor retrains itself on chip.'
    kpis:
    - v: 3.87 µs
      l: per training + prediction step (Virtex-7, 100 MHz)
    - v: 5.3×
      l: lower NMSE than the prior on-chip ESN learner
    - v: '>1600×'
      l: energy efficiency vs. a CPU (290× vs. a GPU)
    - v: 264 Mb/s
      l: on 64-dimensional channel data
    points:
    - An output-stationary systolic array computes the readout, about one MAC per DSP per cycle.
    - 'A three-stage pipelined RLS update takes 2L+4 cycles: O(L²) work, but time grows only linearly with the state
      size L.'
    pubs:
    - lin2026tcad
    highlight: true
    role: 'First author: architecture, RTL implementation and FPGA evaluation.'
    impact: Lets a wireless receiver keep learning on the chip itself, thousands of times faster and more energy-efficient
      than a CPU or GPU.
    stack:
    - Verilog
    - Vivado
    - Virtex-7
    - DSP48
    - Systolic arrays
    - Fixed-point
    - Ethernet/UDP
    - Python
  - id: hybrid-neuron
    title: Hybrid DSP–CLB reservoir neuron
    period: 2024 – 2025
    tag: ICNC'26
    img: icnc_neuron.png
    text: Nine DSP slices multiply-accumulate while a CLB adder tree compresses their partial sums, so the DSPs
      never sit idle; a range-addressable tanh keeps the activation cheap.
    kpis:
    - v: 0.97 µs
      l: per prediction for a full ESN (64, 8, 64)
    - v: +25%
      l: DSP efficiency vs. the DSP-only MAC (72×72 MVM)
    - v: 5.7–14.2 dB
      l: lower NMSE than the AR predictor
    points:
    - 'Range-addressable LUT tanh: interpolation where tanh bends, ±1 in saturation; the DSP is clock-gated above
      the threshold and the table BRAM drops by 25%.'
    - 13% less processing time than the DSP-only MAC on a 72×72 matrix–vector product.
    pubs:
    - lin2026icnc
    highlight: true
    role: 'First author: neuron and tanh design, RTL implementation and FPGA evaluation.'
    impact: Gets more work out of every DSP block, so the same chip predicts the radio channel faster.
    stack:
    - Verilog
    - Vivado
    - Virtex-7
    - DSP48
    - LUT design
    - MATLAB/Python
  - id: bit-serial
    title: Bit-serial reservoir neuron
    period: 2021 – 2022
    tag: ISQED'22
    img: isqed_arch.png
    text: A low-cost reservoir neuron that hard-wires the fixed, sparse ESN weights into a bit-serial multiplier,
      with canonical-signed-digit encoding and an optimized tanh.
    points:
    - Zero weights and zero bits cost no logic; a known 1-bit operand reduces the multiplier to wiring.
    - Much lower resource utilization than earlier hardware ESNs at comparable accuracy.
    pubs:
    - lin2022isqed
    highlight: true
    role: 'First author: neuron architecture and FPGA implementation.'
    impact: Cuts the logic needed for a neural-network layer by about 80% by hard-wiring its fixed weights.
    stack:
    - Verilog
    - Vivado
    - Bit-serial arithmetic
    - CSD encoding
    - Fixed-point

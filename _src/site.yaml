about: |
  I am a Ph.D. student at Virginia Tech, advised by
  <a href="https://www.yangyi.ece.vt.edu/">Prof. Yang (Cindy) Yi</a>, and a member of <a href="https://bricc.ece.vt.edu/"><b>BRICCS@VT</b></a> (Brain-Inspired Computing, Communication, and Security Lab).
  I design hardware <b>from RTL microarchitecture to complete systems</b>: <b>FPGA accelerators for echo state networks</b>
  (reservoir computing) with <b>on-chip learning</b>, and the <b>system-level design</b> around them (HW/SW partitioning,
  10G Ethernet data paths, host software and integration with live radios) that runs them in <b>real-time wireless systems</b>
  for MIMO symbol detection and channel prediction.
about2: |
  Before Virginia Tech, I received my master's degree in Electrical and Computer Engineering from the University of
  Southern California and my B.E. in Opto-electronic Information from Huazhong University of Science and Technology.

interests: [Reservoir computing, FPGA accelerators, On-chip learning, Next-G wireless, Neuromorphic hardware]


    title: Dynamically secured scan chains and the GF-Flush attack
    period: 2020 – 2021
    tag: DFT'21
    img: gfflush_scan.png
    text: Implemented a dynamically secured scan chain and verified a scan-based attack; the follow-up GF(2) algebraic
      flush attack recovers the dynamic key by solving linear equations over GF(2).
    kpis:

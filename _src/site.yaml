live_demo:
  project: testbeds
  title: Real-time channel prediction on an FPGA
  text: >-
    A base station and its users must know the radio channel, which is how the signal is distorted on the way.
    When users move, that knowledge goes stale within milliseconds. Here an FPGA accelerator learns how the
    channel changes and predicts the next one, live, for two users at once.
  explain:
    - {h: "Left: what the receiver measures", p: "The live channel of every antenna pair of the two users, about 1,250 new measurements per second per user."}
    - {h: "Middle: how good the prediction is", p: "Prediction error of the FPGA (blue) against simply reusing the last measurement (orange). Lower is better; blue stays below orange."}
    - {h: "Right: how fast", p: "Time from a new measurement to the prediction arriving back at the PC (green), under one millisecond, and the FPGA's own share (grey)."}
  fig_cap: "The setup: a 4-antenna base station and two 2-antenna users are linked through a radio channel emulator; host PCs stream the channel to the FPGA over 10 Gb/s Ethernet."


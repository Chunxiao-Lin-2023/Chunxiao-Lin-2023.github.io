pub_summary:
  lin2025book: "Surveys AI and machine learning methods across the FPGA CAD flow, covering HLS metric prediction and design space exploration, logic synthesis, placement congestion and routability prediction, and learning-based routing."
  yang2025book: "Reviews how machine learning enhances and threatens IC trustworthiness, covering logic-locking attacks and defenses, hardware Trojan detection, fuzzing, reverse engineering and PUFs, and argues for combining ML with conventional methods."

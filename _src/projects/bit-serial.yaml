pub_summary: "Proposes an FPGA reservoir-node architecture using bit-serial multipliers hard-wired to fixed sparse weights, CSD weight encoding and a simplified tanh, cutting LUTs by 80.7% and DSPs from 162 to 16 versus a DSP-based ESN."
